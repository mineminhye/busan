<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>흥남부두에서 국제시장까지</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* ===== 영상 설정: 여기만 고치면 됩니다 ===== */
</style>
<script>
  const EMBED = false;   // true로 바꾸면 페이지 안에서 재생 시도
  const CONFIG = {
    video1: { id: "PFXSqRWVxcc", start: 381, end: 540 },   // 06:21 ~ 09:00
    video2: { id: "_mcTI_-Ua4c", start: 545, end: null },  // 09:05 ~ 끝
    bridge: "이렇게 목숨을 걸고 부산에 도착한 피란민들은<br>어디서, 어떻게 삶을 이어갔을까요?<br><br><b>이제 영화 속 ‘국제시장’으로 가봅니다.</b>"
  };
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: #fff;
    font-family: 'Jua', 'Malgun Gothic', '맑은 고딕', sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #playerWrap { position: absolute; inset: 0; }
  #player { width: 100%; height: 100%; }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 4vh 6vw;
    background: #000; z-index: 5; }
  .screen.on { display: flex; animation: fade .8s ease; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  .tag { font-size: 2.2rem; color: #7fb3e6; letter-spacing: .1em; margin-bottom: 2vh; }
  h1 { font-size: 5.2rem; line-height: 1.25; margin-bottom: 3vh; }
  .desc { font-size: 2.2rem; color: #c9d6e3; line-height: 1.6; margin-bottom: 5vh; }
  .bridge { font-size: 3.6rem; line-height: 1.6; color: #f3f3f3; margin-bottom: 6vh; }
  .bridge b { color: #ffd166; font-weight: normal; }
  .btn { font-family: inherit; font-size: 2.6rem; padding: 1.6vh 3.2vw; border-radius: 999px;
    border: 3px solid #ffd166; background: transparent; color: #ffd166; cursor: pointer; transition: .2s; }
  .btn:hover { background: #ffd166; color: #000; }
  .steps { display: flex; gap: 2vw; margin-bottom: 5vh; flex-wrap: wrap; justify-content: center; }
  .step { font-size: 1.9rem; color: #9fb4c8; border: 2px solid #2c3e50; border-radius: 16px; padding: 1.4vh 1.6vw; }
  .step b { color: #fff; font-weight: normal; }
  #err { font-size: 2rem; color: #ffb4a2; margin-top: 3vh; line-height: 1.6; }
  #err a { color: #ffd166; }
  /* 상단 이동 바 (마우스 올리면 보임) */
  #nav { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; gap: 10px;
    justify-content: center; padding: 10px; background: linear-gradient(#000c, #0000);
    opacity: 0; transition: opacity .3s; }
  #nav:hover { opacity: 1; }
  #nav button { font-family: inherit; font-size: 1.3rem; padding: 6px 16px; border-radius: 999px;
    border: 1px solid #556; background: #111c; color: #ddd; cursor: pointer; }
  #nav button:hover { border-color: #ffd166; color: #ffd166; }
</style>
</head>
<body>
<div id="nav">
  <button onclick="showIntro()">처음</button>
  <button onclick="playStep(1)">① 흥남철수</button>
  <button onclick="showBridge()">연결 자막</button>
  <button onclick="playStep(2)">② 영화 국제시장</button>
  <button onclick="toggleFull()">전체화면</button>
</div>

<div id="stage">
  <div id="playerWrap"><div id="player"></div></div>

  <div class="screen on" id="intro">
    <div class="tag">부산의 재발견 · 피란수도 부산과 사람들의 삶</div>
    <h1>바람 찬 흥남부두에서<br>부산 꽃분이네까지</h1>
    <div class="steps">
      <div class="step"><b>① 배경 영상</b><br>흥남철수와 메러디스 빅토리호</div>
      <div class="step"><b>② 영화 클립</b><br>국제시장 · 천막교실</div>
    </div>
    <button class="btn" onclick="playStep(1)">▶ 시작하기</button>
    <div id="err"></div>
  </div>

  <div class="screen" id="bridge">
    <div class="bridge" id="bridgeText"></div>
    <button class="btn" onclick="playStep(2)">▶ 영화 보러 가기</button>
  </div>

  <div class="screen" id="fallback">
    <div class="tag" id="fbTag"></div>
    <div class="bridge" id="fbText" style="font-size:2.6rem"></div>
    <div style="display:flex;gap:2vw;flex-wrap:wrap;justify-content:center">
      <a class="btn" id="fbOpen" target="_blank" style="text-decoration:none">▶ 유튜브에서 열기</a>
      <button class="btn" id="fbNext" style="border-color:#7fb3e6;color:#7fb3e6">다 봤어요 → 다음</button>
    </div>
  </div>

  <div class="screen" id="end">
    <div class="tag">영상 끝</div>
    <h1>활동지를 꺼내 봅시다 ✏️</h1>
    <div class="desc">1단계부터 차례대로 떠올리며 적어 보세요.</div>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  let player, current = 0, ready = false, watcher = null;
  document.getElementById('bridgeText').innerHTML = CONFIG.bridge;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      width: '100%', height: '100%',
      playerVars: Object.assign({ rel: 0, modestbranding: 1, playsinline: 1 },
        location.protocol.startsWith('http') ? { origin: location.origin } : {}),
      events: {
        onReady: () => { ready = true; },
        onStateChange: onState,
        onError: onErr
      }
    });
  }

  function screen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
    if (id) document.getElementById(id).classList.add('on');
  }

  function showIntro() { stop(); current = 0; screen('intro'); }
  function showBridge() { stop(); current = 0; screen('bridge'); }

  function stop() {
    clearInterval(watcher);
    if (ready && player.stopVideo) player.stopVideo();
  }

  function playStep(n) {
    if (!EMBED) { current = n; onErr({ data: 150 }); return; }
    if (!ready) { setTimeout(() => playStep(n), 300); return; }
    clearInterval(watcher);
    document.getElementById('err').textContent = '';
    current = n;
    const v = n === 1 ? CONFIG.video1 : CONFIG.video2;
    const opt = { videoId: v.id, startSeconds: v.start };
    if (v.end) opt.endSeconds = v.end;
    screen(null);
    player.loadVideoById(opt);
    // 끝 지점 감시 (endSeconds가 무시되는 경우 대비)
    if (v.end) watcher = setInterval(() => {
      if (player.getCurrentTime && player.getCurrentTime() >= v.end) finish();
    }, 300);
  }

  function finish() {
    const n = current;
    stop();
    current = 0;
    if (n === 1) screen('bridge');
    else if (n === 2) screen('end');
  }

  function onState(e) {
    if (e.data === YT.PlayerState.ENDED && current) finish();
  }

  function fmt(sec){ return Math.floor(sec/60)+'분 '+String(sec%60).padStart(2,'0')+'초'; }

  function onErr(e) {
    const n = current || 1;
    const v = n === 2 ? CONFIG.video2 : CONFIG.video1;
    stop(); current = 0;
    if (e.data === 153 && location.protocol === 'file:') {
      screen('intro');
      document.getElementById('err').innerHTML = '파일을 컴퓨터에서 바로 열면 유튜브가 재생을 막아요.<br>GitHub Pages 주소(https://…)로 열어 주세요.';
      return;
    }
    // 150/101: 영상 주인이 다른 사이트 재생을 막아 둔 경우 → 유튜브 새 창으로
    document.getElementById('fbTag').textContent = n === 1 ? '① 배경 영상' : '② 영화 클립';
    document.getElementById('fbText').innerHTML =
      '유튜브 새 창에서 영상을 봐요.<br>' +
      '<b>' + fmt(v.start) + '</b>부터 시작돼요.' +
      (v.end ? ' <b>' + fmt(v.end) + '</b>에 멈춰 주세요.' : ' 끝까지 보면 돼요.');
    document.getElementById('fbOpen').href = `https://www.youtube.com/watch?v=${v.id}&t=${v.start}s`;
    document.getElementById('fbNext').onclick = () => screen(n === 1 ? 'bridge' : 'end');
    screen('fallback');
  }

  function toggleFull() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
  document.addEventListener('keydown', e => { if (e.key === 'f') toggleFull(); });
</script>
</body>
</html>
